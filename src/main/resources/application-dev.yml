spring:
  datasource:
    url: jdbc:h2:mem:employee_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    com.example.employeemanagement: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,scheduledtasks

  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      secret: "${JWT_SECRET:development-only-secret-key-change-me-123456}"

    dev-users:
      admin-password: "${DEV_ADMIN_PASSWORD:Admin123!}"
      user-password: "${DEV_USER_PASSWORD:User123!}"